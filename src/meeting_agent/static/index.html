<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Meeting Agent</title>
  <!-- Apply theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🤖</span>
        <span class="brand-text">AI Meeting<br />Agent</span>
      </div>
      <nav class="nav">
        <a href="#/dashboard" class="nav-item" data-route="dashboard"><span class="nav-ico">📊</span> Dashboard</a>
        <a href="#/meetings" class="nav-item" data-route="meetings"><span class="nav-ico">📅</span> Meetings</a>
        <a href="#/tasks" class="nav-item" data-route="tasks"><span class="nav-ico">✅</span> Tasks</a>
        <a href="#/settings" class="nav-item" data-route="settings"><span class="nav-ico">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/docs" target="_blank" rel="noopener" class="sidebar-link">📖 API Docs</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <button id="theme-toggle" class="btn btn-ghost icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
