[project]
name = "ai-meeting-agent"
version = "0.1.0"
description = "AI agent that joins meetings, records audio, transcribes, summarizes, extracts tasks, and emails participants"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AI Meeting Agent Team"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "faster-whisper>=1.1",
    "openai>=1.60",
    "sendgrid>=6.11",
    "httpx>=0.28",
    "playwright>=1.49",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=2.1",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "structlog>=24.0",
    "websockets>=14.0",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "factory-boy>=3.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_agent = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short -p no:launch_testing -p no:launch_testing_ros"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
